# docker compose up --build
# then, once:  docker compose exec ollama ollama pull llama3
# and open http://localhost:8000
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      QPG_OLLAMA_URL: http://ollama:11434
    volumes:
      - qpg-data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama

volumes:
  qpg-data:
  ollama-models:
